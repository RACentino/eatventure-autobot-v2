[project]
name = "eatventure-autobot"
version = "0.1.0"
description = "Cross-platform OpenCV screen-automation bot for Eatventure via scrcpy"
requires-python = ">=3.11"
dependencies = [
    "opencv-python==4.13.0.92",
    "numpy==2.4.4",
    "pynput==1.8.2",
    "requests==2.34.0",
    "PyWinCtl==0.4.1",
]

[project.optional-dependencies]
windows = ["mss==10.2.0"]
linux = ["python-xlib==0.33"]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.16.4", "mypy==1.14.1"]

[project.scripts]
eatventure-autobot = "eatventure_autobot.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["Xlib.*", "mss.*", "pynput.*"]
ignore_missing_imports = true
